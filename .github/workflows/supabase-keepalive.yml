# Supabase pauses free projects after 7 days without activity. A weekly
# request keeps it awake. The app keeps working while paused (history is
# local-first); this just keeps sync and AI coaching available.
#
# Repo settings > Secrets and variables > Actions > Variables:
#   SUPABASE_URL, SUPABASE_ANON_KEY
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SUPABASE_URL != ''
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/sets?select=id&limit=1"
