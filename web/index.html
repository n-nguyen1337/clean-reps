<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>cleanReps</title>
    <meta name="description" content="Real-time exercise form feedback from your camera. Counts reps and cues your form, all on your device." />
    <!-- Link previews (iMessage, Slack, social). Crawlers need absolute URLs and a PNG/JPEG, not SVG. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="cleanReps" />
    <meta property="og:title" content="cleanReps" />
    <meta property="og:description" content="Real-time exercise form feedback from your camera." />
    <meta property="og:url" content="https://clean-reps.pages.dev/" />
    <meta property="og:image" content="https://clean-reps.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- GoatCounter page counts. Hash routes count as pages (#/about → /about), set ids are collapsed
         into /set, and the first page load is counted by count.js itself. It skips localhost. -->
    <script>
      window.goatcounter = {
        path: function () { return location.hash.replace(/^#?\/?/, "/").replace(/^\/set\/.*/, "/set"); },
      };
      window.addEventListener("hashchange", function () {
        if (window.goatcounter.count) window.goatcounter.count();
      });
    </script>
    <script data-goatcounter="https://cleanreps.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
