# Bicep curl. Primary metric: elbow angle, ~170 arm extended, ~40 fully curled.
name: Bicep curl
camera_hint: Side view of the working arm, or front view.
primary_metric: elbow_angle
top_threshold: 150
bottom_threshold: 70
hysteresis: 8
min_excursion: 30
partial_cue: Curl all the way up

rules:
  - id: full_curl
    metric: elbow_angle
    aggregate: min
    max: 55
    cue: Squeeze all the way to the top
    priority: 2

  - id: elbow_drift
    metric: elbow_drift
    max: 30
    min_frames: 4
    cue: Keep your elbows pinned to your sides
    priority: 3

  - id: torso_swing
    metric: torso_lean
    max: 15
    min_frames: 4
    cue: Don't swing your body
    priority: 3
