# Squat. Primary metric: knee angle (hip-knee-ankle), ~175 standing, ~90 at parallel.
name: Squat
camera_hint: Side view for depth and torso lean; front view for knee tracking.
primary_metric: knee_angle
top_threshold: 160       # standing tall; the most a learned top can be
top_margin: 10           # learned top = how you stand while settling (lower quartile), minus this
top_floor: 145           # the least a learned top can be
bottom_threshold: 120    # deep enough to count as a rep
hysteresis: 8
min_excursion: 25        # smaller dips are ignored rather than flagged as partial reps
partial_cue: Go deeper

rules:
  - id: depth
    metric: hip_height    # hips over ankles / leg length: ~0.97 standing, ~0.2-0.5 deep, ~0.65-0.7 shallow
    aggregate: min
    max: 0.58             # fault if the hips never get lower than this
    cue: Squat a little deeper
    priority: 3

  - id: hips_high
    metric: hip_height    # an RDL or a step stays above ~0.78: the hips hinge back but don't drop
    aggregate: min
    max: 0.74
    no_rep: true
    cue: Bend your knees and sit down
    priority: 3

  - id: hip_hinge
    metric: hip_angle     # torso-thigh angle, ~170 standing, ~40-90 at the bottom of a squat
    aggregate: min
    max: 120              # bending only the knees leaves the hips nearly straight
    no_rep: true
    cue: Sit your hips back
    priority: 3

  - id: torso_lean
    metric: torso_lean    # side view only
    max: 50
    cue: Chest up
    priority: 2

  - id: knee_valgus
    metric: knee_ratio    # front view only
    min: 0.8
    min_frames: 4
    cue: Push your knees out
    priority: 2

# Body proportions shift a rule's limits (min and max) by these amounts.
# To keep balance over midfoot, the hips have to sit back as far as the
# femurs reach, so long femurs relative to the torso force more forward lean.
# Average proportions use the limits above unchanged.
proportions:
  femur:
    long: {torso_lean: 8}
    short: {torso_lean: -5}
  torso:
    long: {torso_lean: -5}
    short: {torso_lean: 7}
